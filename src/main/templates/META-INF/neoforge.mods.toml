modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ars_nouveau"
type = "required"
versionRange = "${ars_nouveau_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ars_deco"
type = "required"
versionRange = "${ars_deco_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecolonies"
type = "required"
versionRange = "${minecolonies_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "structurize"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# Archwood Collective style pack: used for every hut it provides (see PLAN.md, "Building style").
[[dependencies.${mod_id}]]
modId = "archwoodcolonies"
type = "required"
versionRange = "${archwood_colonies_version_range}"
ordering = "AFTER"
side = "BOTH"
